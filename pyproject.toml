[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demandcast-mlops"
version = "0.1.0"
description = "Day-ahead demand forecasting with SQL features, CatBoost, calibrated intervals, and model monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jaber Mobarak"}]
dependencies = [
  "catboost>=1.2.7,<2", "duckdb>=1.1,<2", "numpy>=1.26,<3", "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.27,<1", "prometheus-client>=0.20,<1"
]

[project.optional-dependencies]
train = ["mlflow>=3.1,<4", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6"]

[project.scripts]
demandcast = "demandcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demandcast = ["static/*", "sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
